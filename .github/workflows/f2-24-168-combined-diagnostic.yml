name: F2-24-168 Combined Diagnostic Gate

on:
  push:
    paths:
      - 'f2-24-168-trigger.txt'

permissions:
  contents: read

concurrency:
  group: f2-24-168-combined-diagnostic
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: mferreirasilva/AppMotora
  PRIVATE_ARTIFACT_NAME: f2-24-168-diagnostic-bundle
  AVD_NAME: f2-24-168-api36
  EMULATOR_SERIAL: emulator-5554
  PUBLIC_EVIDENCE_DIR: evidence

jobs:
  diagnostic-gate:
    name: API36 4-vCPU acquisition + combined TXT gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Resolve authenticated private bundle - FAIL FAST
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.APPMOTORA_PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$PUBLIC_EVIDENCE_DIR"
          {
            echo "logical_cpus=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "arch=$(uname -m)"
          } > "$PUBLIC_EVIDENCE_DIR/host-resources.txt"
          (( $(nproc) >= 4 )) || { echo 'classification=FAIL_ENVIRONMENT_HOST_LT_4_VCPU' > "$PUBLIC_EVIDENCE_DIR/result.txt"; exit 40; }
          [[ -n "${PRIVATE_TOKEN:-}" ]] || { echo 'classification=BLOCKED_PRIVATE_ARTIFACT_TOKEN' > "$PUBLIC_EVIDENCE_DIR/result.txt"; exit 78; }

          PRIVATE_DIR="$RUNNER_TEMP/f2-24-168-private"
          JSON="$RUNNER_TEMP/f2-24-168-artifacts.json"
          ZIP="$RUNNER_TEMP/f2-24-168.zip"
          rm -rf "$PRIVATE_DIR" "$JSON" "$ZIP"
          mkdir -p "$PRIVATE_DIR"
          API="https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/artifacts"

          curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $PRIVATE_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API?name=$PRIVATE_ARTIFACT_NAME&per_page=20" -o "$JSON"
          ID="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' "$JSON")"
          DIGEST="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].digest // empty' "$JSON")"
          [[ -n "$ID" ]]
          curl --fail --silent --show-error --location             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $PRIVATE_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API/$ID/zip" -o "$ZIP"
          if [[ "$DIGEST" =~ ^sha256:([0-9a-f]{64})$ ]]; then
            [[ "$(sha256sum "$ZIP" | awk '{print $1}')" == "${BASH_REMATCH[1]}" ]]
          fi
          unzip -q "$ZIP" -d "$PRIVATE_DIR"
          test -f "$PRIVATE_DIR/app.apk"
          test -f "$PRIVATE_DIR/helper.apk"
          test -f "$PRIVATE_DIR/bundle.env"
          set -a; source "$PRIVATE_DIR/bundle.env"; set +a
          echo "$APP_SHA256  $PRIVATE_DIR/app.apk" | sha256sum --check - >/dev/null
          echo "$HELPER_SHA256  $PRIVATE_DIR/helper.apk" | sha256sum --check - >/dev/null
          [[ "$APP_PACKAGE" == 'br.com.appmotora.dev' ]]
          [[ "$HELPER_PACKAGE" == 'com.ubercab.driver' ]]
          {
            echo "private_artifact_id=$ID"
            echo 'bundle_integrity=PASS'
          } > "$PUBLIC_EVIDENCE_DIR/bundle-integrity.txt"
          echo "PRIVATE_DIR=$PRIVATE_DIR" >> "$GITHUB_ENV"
          echo "APP_PACKAGE=$APP_PACKAGE" >> "$GITHUB_ENV"
          echo "SERVICE_CLASS=$SERVICE_CLASS" >> "$GITHUB_ENV"
          echo "HELPER_PACKAGE=$HELPER_PACKAGE" >> "$GITHUB_ENV"
          echo "HELPER_ACTIVITY=$HELPER_ACTIVITY" >> "$GITHUB_ENV"
          echo "RUNTIME_ACTIVITY=$RUNTIME_ACTIVITY" >> "$GITHUB_ENV"
          echo "RUNTIME_ACTION=$RUNTIME_ACTION" >> "$GITHUB_ENV"
          echo "PROBE_ACTIVITY=$PROBE_ACTIVITY" >> "$GITHUB_ENV"
          echo "PROBE_FILE=$PROBE_FILE" >> "$GITHUB_ENV"

      - name: Prepare CLEAN API36 4-vCPU emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          AVD_HOME="$HOME/.android/avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          if ! ldconfig -p | grep -Fq 'libpulse.so.0'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpulse0 >/dev/null
          fi
          sdkmanager --install emulator 'system-images;android-36;google_apis;x86_64' >/dev/null

          cat > "$RUNNER_TEMP/f2-24-168-health.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="${1:?checkpoint required}"
          window="$RUNNER_TEMP/f2-24-168-window.txt"
          timeout 65s adb -s "$EMULATOR_SERIAL" shell cmd package wait-for-handler --timeout 60000 >/dev/null 2>&1
          timeout 65s adb -s "$EMULATOR_SERIAL" shell cmd package wait-for-background-handler --timeout 60000 >/dev/null 2>&1
          timeout 15s adb -s "$EMULATOR_SERIAL" shell dumpsys window windows > "$window" 2>&1
          pid="$(timeout 10s adb -s "$EMULATOR_SERIAL" shell pidof com.android.systemui 2>/dev/null | tr -d '\r' || true)"
          test -n "$pid"
          if awk '
            /^  Window #[0-9]+ Window\{/ { if (in_anr && visible) found=1; in_anr=index($0,"Application Not Responding: com.android.systemui")>0; visible=0; next }
            in_anr && /isVisible=true/ { visible=1 }
            END { if (in_anr && visible) found=1; exit(found ? 0 : 1) }
          ' "$window"; then
            echo "$label=VISIBLE_SYSTEMUI_ANR" >> "$PUBLIC_EVIDENCE_DIR/health-checkpoints.txt"
            exit 42
          fi
          previous="$(cat "$RUNNER_TEMP/f2-24-168-last-pid.txt" 2>/dev/null || true)"
          [[ -z "$previous" || "$previous" == "$pid" ]] || exit 43
          printf '%s' "$pid" > "$RUNNER_TEMP/f2-24-168-last-pid.txt"
          echo "$label=CLEAN" >> "$PUBLIC_EVIDENCE_DIR/health-checkpoints.txt"
          BASH
          chmod +x "$RUNNER_TEMP/f2-24-168-health.sh"

          rm -rf "$ANDROID_AVD_HOME/$AVD_NAME.avd" "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          echo no | avdmanager create avd --force -n "$AVD_NAME" --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_6' >/dev/null
          {
            echo 'hw.cpu.ncore=4'
            echo 'hw.ramSize=4096'
            echo 'vm.heapSize=512'
            echo 'disk.dataPartition.size=4096M'
          } >> "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          adb start-server
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -port 5554 -avd "$AVD_NAME" -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-metrics > "$RUNNER_TEMP/f2-24-168-emulator.log" 2>&1 &
          for _ in $(seq 1 120); do
            adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null | grep -qx device && break
            sleep 2
          done
          [[ "$(adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null)" == device ]]
          for _ in $(seq 1 120); do
            if [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 && "$(adb -s "$EMULATOR_SERIAL" shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')" == stopped ]]; then
              break
            fi
            sleep 2
          done
          [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" == 36 ]]
          adb -s "$EMULATOR_SERIAL" shell settings put global window_animation_scale 0.0
          adb -s "$EMULATOR_SERIAL" shell settings put global transition_animation_scale 0.0
          adb -s "$EMULATOR_SERIAL" shell settings put global animator_duration_scale 0.0
          "$RUNNER_TEMP/f2-24-168-health.sh" boot_clean_1
          sleep 5
          "$RUNNER_TEMP/f2-24-168-health.sh" boot_clean_2

      - name: Install private DEV APK and synthetic helper
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/f2-24-168-health.sh" pre_install
          adb -s "$EMULATOR_SERIAL" install -r -t "$PRIVATE_DIR/app.apk" >/dev/null
          adb -s "$EMULATOR_SERIAL" install -r "$PRIVATE_DIR/helper.apk" >/dev/null
          adb -s "$EMULATOR_SERIAL" shell pm path "$APP_PACKAGE" >/dev/null
          adb -s "$EMULATOR_SERIAL" shell pm path "$HELPER_PACKAGE" >/dev/null
          "$RUNNER_TEMP/f2-24-168-health.sh" post_install

      - name: Enable existing Accessibility and overlay capability
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT="$APP_PACKAGE/$SERVICE_CLASS"
          adb -s "$EMULATOR_SERIAL" shell settings put secure enabled_accessibility_services "$COMPONENT"
          adb -s "$EMULATOR_SERIAL" shell settings put secure accessibility_enabled 1
          adb -s "$EMULATOR_SERIAL" shell appops set "$APP_PACKAGE" SYSTEM_ALERT_WINDOW allow
          READY=false
          for _ in $(seq 1 30); do
            state="$(adb -s "$EMULATOR_SERIAL" shell dumpsys accessibility 2>/dev/null || true)"
            if grep -Fq "$COMPONENT" <<< "$state" && grep -Fq 'Bound services:{Service[' <<< "$state"; then READY=true; break; fi
            sleep 1
          done
          [[ "$READY" == true ]]
          "$RUNNER_TEMP/f2-24-168-health.sh" post_accessibility

      - name: Run one synthetic offer and validate combined diagnostic TXT
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_LOG="$RUNNER_TEMP/f2-24-168-private-logcat.txt"
          PRIVATE_TXT="$RUNNER_TEMP/f2-24-168-combined.txt"
          adb -s "$EMULATOR_SERIAL" logcat -c
          adb -s "$EMULATOR_SERIAL" shell am start -W             -a "$RUNTIME_ACTION"             -n "$APP_PACKAGE/$RUNTIME_ACTIVITY" >/dev/null

          wait_log() {
            local pattern="$1" attempts="${2:-60}"
            for _ in $(seq 1 "$attempts"); do
              adb -s "$EMULATOR_SERIAL" logcat -d -v brief                 'AppMotoraA11yM6:I' 'AppMotoraSemaforoV5:I' 'AppMotoraQaUber168:I' '*:S' > "$PRIVATE_LOG" || true
              grep -Eq "$pattern" "$PRIVATE_LOG" && return 0
              sleep 1
            done
            return 1
          }

          wait_log 'V5_RUNTIME_READY ' 20
          wait_log 'M4_ARMED ' 20
          adb -s "$EMULATOR_SERIAL" shell am start -W -n "$HELPER_PACKAGE/$HELPER_ACTIVITY" >/dev/null
          wait_log 'QA_F2_24_168_OFFER_A pixels=VERIFIED' 15
          wait_log 'SCREENSHOT_SUCCESS ' 60
          wait_log 'M4_RESULT .*OCR_5OF5=true' 90
          wait_log 'OFFER_NORMALIZED package=com\.ubercab\.driver ' 30

          adb -s "$EMULATOR_SERIAL" shell am start -W -n "$APP_PACKAGE/$PROBE_ACTIVITY" >/dev/null
          sleep 2
          adb -s "$EMULATOR_SERIAL" shell run-as "$APP_PACKAGE" cat "files/$PROBE_FILE" > "$PRIVATE_TXT"
          test -s "$PRIVATE_TXT"

          grep -Fq '# runtime' "$PRIVATE_TXT"
          grep -Eq 'stage=RUNTIME|V5_RUNTIME|RUNTIME_STARTED|DECISION' "$PRIVATE_TXT"
          grep -Fq '# acquisition' "$PRIVATE_TXT"
          grep -Fq 'acquisitionSession=AVAILABLE' "$PRIVATE_TXT"
          grep -Fq 'M4_ARMED ' "$PRIVATE_TXT"
          grep -Fq 'SCREENSHOT_SUCCESS ' "$PRIVATE_TXT"
          grep -Fq 'M4_RESULT ' "$PRIVATE_TXT"
          grep -Fq 'OFFER_NORMALIZED package=com.ubercab.driver ' "$PRIVATE_TXT"
          grep -Fq 'diagnosticGuardrails=screenshot:false preview:false rawOcrText:false automaticUpload:false manualShare:true' "$PRIVATE_TXT"
          ! grep -Fq 'http://' "$PRIVATE_TXT"
          ! grep -Fq 'https://' "$PRIVATE_TXT"
          "$RUNNER_TEMP/f2-24-168-health.sh" post_diagnostic

          ACQ_COUNT="$(grep -Ec '^20[0-9]{2}-.*sessionId=' "$PRIVATE_TXT" || true)"
          {
            echo 'classification=PASS_F2_24_168_COMBINED_DIAGNOSTIC'
            echo 'environment=API36_4VCPU_CLEAN'
            echo 'runtime_block=true'
            echo 'acquisition_block=true'
            echo 'm4_armed=true'
            echo 'screenshot_success=true'
            echo 'm4_result=true'
            echo 'offer_normalized=true'
            echo "acquisition_event_count=$ACQ_COUNT"
            echo 'raw_ocr=false'
            echo 'screenshots_exported=false'
            echo 'automatic_upload=false'
          } > "$PUBLIC_EVIDENCE_DIR/result.txt"

      - name: Remove private material before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PRIVATE_DIR:-$RUNNER_TEMP/f2-24-168-private}"
          rm -f "$RUNNER_TEMP/f2-24-168.zip" "$RUNNER_TEMP/f2-24-168-artifacts.json"
          rm -f "$RUNNER_TEMP/f2-24-168-private-logcat.txt" "$RUNNER_TEMP/f2-24-168-combined.txt"
          ! find "$PUBLIC_EVIDENCE_DIR" -type f \( -name '*.apk' -o -name '*.png' -o -name '*.txt' -path '*private*' \) | grep -q .

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f2-24-168-combined-diagnostic-sanitized
          path: evidence/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record sanitized summary
        if: always()
        shell: bash
        run: |
          {
            echo '### F2-24-168 combined diagnostic gate'
            sed 's/^/- /' "$PUBLIC_EVIDENCE_DIR/result.txt" 2>/dev/null || true
            echo '- Private APK/helper/TXT/logcat removed before public evidence upload.'
          } >> "$GITHUB_STEP_SUMMARY"
