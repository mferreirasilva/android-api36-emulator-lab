name: F2-24-179 Post-Decision Latency Gate

on:
  push:
    paths:
      - 'f2-24-173-runtime-trigger.txt'

permissions:
  contents: read

concurrency:
  group: f2-24-179-runtime-same-offer
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: mferreirasilva/AppMotora
  PRIVATE_ARTIFACT_NAME: f2-24-179-runtime-bundle
  AVD_NAME: f2-24-179-runtime-api36
  EMULATOR_SERIAL: emulator-5554
  EVIDENCE_DIR: evidence

jobs:
  hold-gate:
    name: API36 4-vCPU no-flap plus bounded close latency
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Resolve authenticated private bundle
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.APPMOTORA_PRIVATE_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          (( $(nproc) >= 4 )) || { echo 'classification=FAIL_ENVIRONMENT_HOST_LT_4_VCPU' > "$EVIDENCE_DIR/result.txt"; exit 40; }
          [[ -n "${PRIVATE_TOKEN:-}" ]] || { echo 'classification=BLOCKED_PRIVATE_ARTIFACT_TOKEN' > "$EVIDENCE_DIR/result.txt"; exit 78; }

          PRIVATE_DIR="$RUNNER_TEMP/f2-24-173-runtime-private"
          JSON="$RUNNER_TEMP/f2-24-173-runtime-artifacts.json"
          ZIP="$RUNNER_TEMP/f2-24-173-runtime.zip"
          rm -rf "$PRIVATE_DIR" "$JSON" "$ZIP"; mkdir -p "$PRIVATE_DIR"
          API="https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/artifacts"
          curl --fail --silent --show-error             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $PRIVATE_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API?name=$PRIVATE_ARTIFACT_NAME&per_page=20" -o "$JSON"
          ID="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' "$JSON")"
          DIGEST="$(jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].digest // empty' "$JSON")"
          [[ -n "$ID" ]]
          curl --fail --silent --show-error --location             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer $PRIVATE_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "$API/$ID/zip" -o "$ZIP"
          if [[ "$DIGEST" =~ ^sha256:([0-9a-f]{64})$ ]]; then
            [[ "$(sha256sum "$ZIP" | awk '{print $1}')" == "${BASH_REMATCH[1]}" ]]
          fi
          unzip -q "$ZIP" -d "$PRIVATE_DIR"
          test -s "$PRIVATE_DIR/app.apk"
          test -s "$PRIVATE_DIR/helper.apk"
          test -s "$PRIVATE_DIR/bundle.env"
          (
            cd "$PRIVATE_DIR"
            sha256sum --check bundle.sha256 >/dev/null
          )
          set -a; source "$PRIVATE_DIR/bundle.env"; set +a
          echo "PRIVATE_DIR=$PRIVATE_DIR" >> "$GITHUB_ENV"
          echo "APP_PACKAGE=$APP_PACKAGE" >> "$GITHUB_ENV"
          echo "SERVICE_CLASS=$SERVICE_CLASS" >> "$GITHUB_ENV"
          echo "HELPER_PACKAGE=$HELPER_PACKAGE" >> "$GITHUB_ENV"
          echo "HELPER_ACTIVITY=$HELPER_ACTIVITY" >> "$GITHUB_ENV"
          echo "RUNTIME_ACTIVITY=$RUNTIME_ACTIVITY" >> "$GITHUB_ENV"
          echo "RUNTIME_ACTION=$RUNTIME_ACTION" >> "$GITHUB_ENV"
          echo "private_artifact_id=$ID" > "$EVIDENCE_DIR/bundle-integrity.txt"
          echo 'bundle_integrity=PASS' >> "$EVIDENCE_DIR/bundle-integrity.txt"

      - name: Prepare CLEAN API36 4-vCPU emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          AVD_HOME="$HOME/.android/avd"; mkdir -p "$AVD_HOME"; export ANDROID_AVD_HOME="$AVD_HOME"; echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          if ! ldconfig -p | grep -Fq 'libpulse.so.0'; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpulse0 >/dev/null; fi
          sdkmanager --install emulator 'system-images;android-36;google_apis;x86_64' >/dev/null

          cat > "$RUNNER_TEMP/health.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="${1:?}"
          timeout 65s adb -s "$EMULATOR_SERIAL" shell cmd package wait-for-handler --timeout 60000 >/dev/null 2>&1
          timeout 65s adb -s "$EMULATOR_SERIAL" shell cmd package wait-for-background-handler --timeout 60000 >/dev/null 2>&1
          w="$RUNNER_TEMP/window-${label}.txt"
          timeout 15s adb -s "$EMULATOR_SERIAL" shell dumpsys window windows > "$w" 2>&1
          pid="$(adb -s "$EMULATOR_SERIAL" shell pidof com.android.systemui 2>/dev/null | tr -d '\r' || true)"
          test -n "$pid"
          if awk '
            /^  Window #[0-9]+ Window\{/ { if (in_anr && visible) found=1; in_anr=index($0,"Application Not Responding: com.android.systemui")>0; visible=0; next }
            in_anr && /isVisible=true/ { visible=1 }
            END { if (in_anr && visible) found=1; exit(found ? 0 : 1) }
          ' "$w"; then exit 42; fi
          old="$(cat "$RUNNER_TEMP/pid.txt" 2>/dev/null || true)"
          [[ -z "$old" || "$old" == "$pid" ]] || exit 43
          printf '%s' "$pid" > "$RUNNER_TEMP/pid.txt"
          echo "$label=CLEAN" >> "$EVIDENCE_DIR/health-checkpoints.txt"
          BASH
          chmod +x "$RUNNER_TEMP/health.sh"

          rm -rf "$AVD_HOME/$AVD_NAME.avd" "$AVD_HOME/$AVD_NAME.ini"
          echo no | avdmanager create avd --force -n "$AVD_NAME" --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_6' >/dev/null
          {
            echo 'hw.cpu.ncore=4'
            echo 'hw.ramSize=4096'
            echo 'vm.heapSize=512'
            echo 'disk.dataPartition.size=4096M'
          } >> "$AVD_HOME/$AVD_NAME.avd/config.ini"
          adb start-server
          nohup "$SDK_ROOT/emulator/emulator" -port 5554 -avd "$AVD_NAME" -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 1 120); do adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null | grep -qx device && break; sleep 2; done
          [[ "$(adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null)" == device ]]
          for _ in $(seq 1 120); do
            [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 && "$(adb -s "$EMULATOR_SERIAL" shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')" == stopped ]] && break
            sleep 2
          done
          [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" == 36 ]]
          adb -s "$EMULATOR_SERIAL" shell settings put global window_animation_scale 0.0
          adb -s "$EMULATOR_SERIAL" shell settings put global transition_animation_scale 0.0
          adb -s "$EMULATOR_SERIAL" shell settings put global animator_duration_scale 0.0
          "$RUNNER_TEMP/health.sh" boot_1
          sleep 5
          "$RUNNER_TEMP/health.sh" boot_2

      - name: Install and arm runtime
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/health.sh" pre_install
          adb -s "$EMULATOR_SERIAL" install -r -t "$PRIVATE_DIR/app.apk" >/dev/null
          adb -s "$EMULATOR_SERIAL" install -r "$PRIVATE_DIR/helper.apk" >/dev/null
          COMPONENT="$APP_PACKAGE/$SERVICE_CLASS"
          adb -s "$EMULATOR_SERIAL" shell settings put secure enabled_accessibility_services "$COMPONENT"
          adb -s "$EMULATOR_SERIAL" shell settings put secure accessibility_enabled 1
          adb -s "$EMULATOR_SERIAL" shell appops set "$APP_PACKAGE" SYSTEM_ALERT_WINDOW allow
          for _ in $(seq 1 30); do
            state="$(adb -s "$EMULATOR_SERIAL" shell dumpsys accessibility 2>/dev/null || true)"
            grep -Fq "$COMPONENT" <<< "$state" && grep -Fq 'Bound services:{Service[' <<< "$state" && break
            sleep 1
          done
          "$RUNNER_TEMP/health.sh" post_install

      - name: Hold offer, remove it, and enforce bounded close latency
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/hold-logcat.txt"
          collect() {
            adb -s "$EMULATOR_SERIAL" logcat -d -v brief               'AppMotoraA11yM6:I' 'AppMotoraSemaforoV5:I' 'AppMotoraQaUber173:I' 'AndroidRuntime:E' '*:S' > "$LOG" || true
          }
          wait_re() {
            local p="$1" n="${2:-60}"
            for _ in $(seq 1 "$n"); do collect; grep -Eq "$p" "$LOG" && return 0; sleep 1; done
            return 1
          }
          overlay_attached() {
            adb -s "$EMULATOR_SERIAL" shell dumpsys window windows > "$RUNNER_TEMP/overlay-window.txt" 2>&1 || true
            grep -Fq "$APP_PACKAGE" "$RUNNER_TEMP/overlay-window.txt"
          }
          wait_overlay_attached() {
            for _ in $(seq 1 20); do overlay_attached && return 0; sleep 1; done
            return 1
          }
          wait_overlay_detached() {
            for _ in $(seq 1 20); do if ! overlay_attached; then return 0; fi; sleep 1; done
            return 1
          }

          adb -s "$EMULATOR_SERIAL" logcat -c
          adb -s "$EMULATOR_SERIAL" shell am start -W -a "$RUNTIME_ACTION" -n "$APP_PACKAGE/$RUNTIME_ACTIVITY" >/dev/null
          wait_re 'V5_RUNTIME_READY ' 20
          wait_re 'M4_ARMED ' 20
          adb -s "$EMULATOR_SERIAL" shell am start -W -n "$HELPER_PACKAGE/$HELPER_ACTIVITY" >/dev/null
          wait_re 'QA_F2_24_173_OFFER_A_VISIBLE pixels=VERIFIED' 15
          wait_re 'OFFER_NORMALIZED package=com\.ubercab\.driver value=15\.07 pickupKm=5(\.0)? tripKm=4\.8 pickupTimeMin=12 tripTimeMin=12 ' 90
          wait_re 'V5_RUNTIME status=RUNNING state=DECISION_READY generation=1 ' 20
          wait_overlay_attached

          collect
          START_LINE=$(( $(wc -l < "$LOG") + 1 ))
          sleep 12
          collect
          DELTA="$(tail -n "+$START_LINE" "$LOG")"
          PARTIAL_COUNT="$(grep -Ec 'M4_RESULT .*OCR_5OF5=false .*postDecisionMonitoring=true' <<< "$DELTA" || true)"
          FALLBACK_COUNT="$(grep -Ec 'M4_SPATIAL_FALLBACK_RESULT attempted=true' <<< "$DELTA" || true)"
          LOST_DURING_HOLD="$(grep -Ec 'M4_TARGET_LOST ' <<< "$DELTA" || true)"
          NORMALIZED_DURING_HOLD="$(grep -Ec 'OFFER_NORMALIZED package=com\.ubercab\.driver ' <<< "$DELTA" || true)"
          EMPTY_DURING_HOLD="$(grep -Ec 'V5_RUNTIME status=RUNNING state=EMPTY generation=none' <<< "$DELTA" || true)"
          [[ "$FALLBACK_COUNT" == 0 ]] || { echo 'classification=FAIL_SPATIAL_FALLBACK_RAN_ON_NORMAL_5OF5_PATH' > "$EVIDENCE_DIR/result.txt"; exit 61; }
          [[ "$LOST_DURING_HOLD" == 0 ]] || { echo 'classification=FAIL_FALSE_TARGET_LOSS_DURING_HOLD' > "$EVIDENCE_DIR/result.txt"; exit 62; }
          [[ "$NORMALIZED_DURING_HOLD" == 0 ]] || { echo 'classification=FAIL_DUPLICATE_NORMALIZATION_DURING_HOLD' > "$EVIDENCE_DIR/result.txt"; exit 63; }
          [[ "$EMPTY_DURING_HOLD" == 0 ]] || { echo 'classification=FAIL_RUNTIME_EMPTY_DURING_HOLD' > "$EVIDENCE_DIR/result.txt"; exit 64; }
          overlay_attached || { echo 'classification=FAIL_OVERLAY_NOT_STABLE_DURING_HOLD' > "$EVIDENCE_DIR/result.txt"; exit 65; }

          REMOVAL_LINE=$(( $(wc -l < "$LOG") + 1 ))
          REMOVAL_START_MS="$(date +%s%3N)"
          adb -s "$EMULATOR_SERIAL" shell am force-stop "$HELPER_PACKAGE"

          TARGET_LOSS_SEEN_MS=""
          for _ in $(seq 1 80); do
            collect
            if tail -n "+$REMOVAL_LINE" "$LOG" | grep -Eq 'M4_TARGET_LOST '; then
              TARGET_LOSS_SEEN_MS="$(date +%s%3N)"
              break
            fi
            sleep 0.1
          done
          collect
          REMOVAL="$(tail -n "+$REMOVAL_LINE" "$LOG")"
          LOST_AFTER="$(grep -Ec 'M4_TARGET_LOST ' <<< "$REMOVAL" || true)"
          [[ "$LOST_AFTER" -ge 1 && -n "$TARGET_LOSS_SEEN_MS" ]] || { echo 'classification=FAIL_NO_TARGET_LOSS_AFTER_CARD_REMOVAL' > "$EVIDENCE_DIR/result.txt"; exit 66; }
          TARGET_LOSS_LATENCY_MS=$(( TARGET_LOSS_SEEN_MS - REMOVAL_START_MS ))
          [[ "$TARGET_LOSS_LATENCY_MS" -le 2500 ]] || {
            {
              echo 'classification=FAIL_TARGET_LOSS_LATENCY'
              echo "target_loss_latency_ms=$TARGET_LOSS_LATENCY_MS"
              echo 'target_loss_latency_limit_ms=2500'
            } > "$EVIDENCE_DIR/result.txt"
            exit 68
          }

          for _ in $(seq 1 30); do
            collect
            grep -Eq 'V5_RUNTIME status=RUNNING state=EMPTY generation=none' <<< "$(tail -n "+$REMOVAL_LINE" "$LOG")" && break
            sleep 0.1
          done

          OVERLAY_CLOSED_MS=""
          for _ in $(seq 1 50); do
            if ! overlay_attached; then
              OVERLAY_CLOSED_MS="$(date +%s%3N)"
              break
            fi
            sleep 0.1
          done
          [[ -n "$OVERLAY_CLOSED_MS" ]] || { echo 'classification=FAIL_OVERLAY_STILL_ATTACHED_AFTER_REMOVAL' > "$EVIDENCE_DIR/result.txt"; exit 67; }
          OVERLAY_CLOSE_LATENCY_MS=$(( OVERLAY_CLOSED_MS - REMOVAL_START_MS ))
          [[ "$OVERLAY_CLOSE_LATENCY_MS" -le 3000 ]] || {
            {
              echo 'classification=FAIL_OVERLAY_CLOSE_LATENCY'
              echo "overlay_close_latency_ms=$OVERLAY_CLOSE_LATENCY_MS"
              echo 'overlay_close_latency_limit_ms=3000'
            } > "$EVIDENCE_DIR/result.txt"
            exit 69
          }

          ROI_FAST_PATH="$(grep -Ec 'M4_POST_DECISION_WATCH_STARTED .*roiFastPath=true' "$LOG" || true)"
          ROI_OCR_COUNT="$(grep -Ec 'M4_OCR variant=POST_DECISION_ROI ' "$LOG" || true)"
          [[ "$ROI_FAST_PATH" -ge 1 && "$ROI_OCR_COUNT" -ge 1 ]] || {
            echo 'classification=FAIL_POST_DECISION_ROI_FAST_PATH_NOT_EXERCISED' > "$EVIDENCE_DIR/result.txt"
            exit 70
          }
          "$RUNNER_TEMP/health.sh" post_hold

          cat > "$EVIDENCE_DIR/result.txt" <<EOF
          classification=PASS_F2_24_179_POST_DECISION_LATENCY
          environment=API36_4VCPU_CLEAN
          partial_post_decision_frames=$PARTIAL_COUNT
          spatial_fallback_on_normal_5of5_path=0
          false_target_loss_during_hold=0
          duplicate_normalization_during_hold=0
          runtime_empty_during_hold=0
          overlay_stable_during_hold=true
          post_decision_roi_fast_path=true
          post_decision_roi_ocr_count=$ROI_OCR_COUNT
          target_loss_after_real_removal=true
          target_loss_latency_ms=$TARGET_LOSS_LATENCY_MS
          target_loss_latency_limit_ms=2500
          overlay_closed_after_real_removal=true
          overlay_close_latency_ms=$OVERLAY_CLOSE_LATENCY_MS
          overlay_close_latency_limit_ms=3000
          EOF

      - name: Remove private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PRIVATE_DIR:-$RUNNER_TEMP/f2-24-173-runtime-private}" "$RUNNER_TEMP/f2-24-173-runtime.zip" "$RUNNER_TEMP/f2-24-173-runtime-artifacts.json"
          rm -f "$RUNNER_TEMP/hold-logcat.txt" "$RUNNER_TEMP/overlay-window.txt"
          ! find "$EVIDENCE_DIR" -type f \( -name '*.apk' -o -name '*.png' \) | grep -q .

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f2-24-179-runtime-sanitized
          path: evidence/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
